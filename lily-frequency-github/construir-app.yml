name: Construir app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar y copiar la app web a Android
        run: |
          npm ci
          npx cap sync android

      - name: Preparar llave de firma (si existe)
        env:
          KEYSTORE_B64: ${{ secrets.LILY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lily.jks"
            echo "LILY_KEYSTORE_FILE=$RUNNER_TEMP/lily.jks" >> "$GITHUB_ENV"
          fi

      - name: Construir APK de prueba y AAB para Play Store
        env:
          LILY_KEYSTORE_PASSWORD: ${{ secrets.LILY_KEYSTORE_PASSWORD }}
          LILY_KEY_ALIAS: ${{ secrets.LILY_KEY_ALIAS }}
          LILY_KEY_PASSWORD: ${{ secrets.LILY_KEY_PASSWORD }}
          LILY_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Descargar APK (para instalar en tu celular)
        uses: actions/upload-artifact@v4
        with:
          name: lily-frequency-apk-prueba
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Descargar AAB (para Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: lily-frequency-aab-playstore
          path: android/app/build/outputs/bundle/release/*.aab
